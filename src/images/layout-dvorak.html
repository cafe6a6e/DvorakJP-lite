<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:455px;background:#fff;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#111;padding:28px 36px}
h1{font-size:30px;font-weight:700;letter-spacing:.04em;margin-bottom:18px}
.row{display:flex;gap:8px;margin-bottom:8px}
.k{width:96px;height:96px;border:2px solid #111;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;background:#fff}
.k b{font-size:34px;font-family:Menlo,monospace;line-height:1}
.gap{width:32px}
</style></head><body>
<h1>Dvorak</h1>
<div class="row" style="margin-left:0">
 <div class="k"><b>'</b></div><div class="k"><b>,</b></div><div class="k"><b>.</b></div><div class="k"><b>p</b></div><div class="k"><b>y</b></div>
 <div class="gap"></div>
 <div class="k"><b>f</b></div><div class="k"><b>g</b></div><div class="k"><b>c</b></div><div class="k"><b>r</b></div><div class="k"><b>l</b></div>
</div>
<div class="row" style="margin-left:24px">
 <div class="k"><b>a</b></div><div class="k"><b>o</b></div><div class="k"><b>e</b></div><div class="k"><b>u</b></div><div class="k"><b>i</b></div>
 <div class="gap"></div>
 <div class="k"><b>d</b></div><div class="k"><b>h</b></div><div class="k"><b>t</b></div><div class="k"><b>n</b></div><div class="k"><b>s</b></div>
</div>
<div class="row" style="margin-left:56px">
 <div class="k"><b>;</b></div><div class="k"><b>q</b></div><div class="k"><b>j</b></div><div class="k"><b>k</b></div><div class="k"><b>x</b></div>
 <div class="gap"></div>
 <div class="k"><b>b</b></div><div class="k"><b>m</b></div><div class="k"><b>w</b></div><div class="k"><b>v</b></div><div class="k"><b>z</b></div>
</div>
</body></html>
